[package]
name = "finanzas"
version = "1.0.0"
description = "Finanzas: gastos, apartados y metas"
authors = ["Finanzas"]
license = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "finanzas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
